name: Build Flutter APK (Dev & Prod)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build DEV APK (Flavor: dev)
        run: flutter build apk --flavor dev -t lib/main_dev.dart --release

      - name: Build PROD APK (Flavor: prod)
        run: flutter build apk --flavor prod -t lib/main_prod.dart --release

      - name: Upload Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: fuel-logger-dev-apk
          path: build/app/outputs/flutter-apk/app-dev-release.apk
          if-no-files-found: warn

      - name: Upload Prod APK
        uses: actions/upload-artifact@v4
        with:
          name: fuel-logger-prod-apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          if-no-files-found: warn
