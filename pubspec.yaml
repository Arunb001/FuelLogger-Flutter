name: fuel_logger
description: "Fuel Logger — AMOLED Mobile Mileage & Telemetry Tracker with Supabase Cloud DB"
publish_to: "none"
version: 3.0.0+24

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  google_sign_in: 6.2.2
  file_picker: ^13.4.0
  csv: ^8.0.0
  url_launcher: ^6.3.3
  fl_chart: ^1.3.1
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
